services:
  thermal-forecasting-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-thermal-detect:cpu
    container_name: thermal_forecasting_cpu
    environment:
      - API_PORT=8080
      - HORIZON=5
      - MODEL_DIR=/app/timeseries_service/model
      - DATA_DIR=/app/timeseries_service/data
      - PREDICTION_CALLBACK_URL=http://master-station:8100/api/prediction
    volumes:
      - ./timeseries_service/model:/app/timeseries_service/model:ro
      - ./timeseries_service/data:/app/timeseries_service/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
